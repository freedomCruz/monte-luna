version: "2"
sql:
  - engine: postgresql
    schema:
      - internal/catalog/adapters/postgres/schema.sql
      - internal/catalog/adapters/postgres/migrations
    queries: internal/catalog/adapters/postgres/queries
    gen:
      go:
        package: catalogsql
        out: internal/catalog/adapters/postgres/sqlc
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
