# golangci-lint v2 configuration. Run: go tool -modfile=tools.mod golangci-lint run
version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # contracttest validates HTTP exchanges in tests; production code never imports it.
        contracttest-only-in-tests:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/contracttest/**"
          deny:
            - pkg: github.com/freedomCruz/monte-luna/backend/internal/contracttest
              desc: contracttest is test-only
        catalog-public-surface-only:
          files:
            - "$all"
            - "!**/internal/catalog/**"
          deny:
            - pkg: github.com/freedomCruz/monte-luna/backend/internal/catalog/domain
              desc: Import only the catalog root facade
            - pkg: github.com/freedomCruz/monte-luna/backend/internal/catalog/app
              desc: Import only the catalog root facade
            - pkg: github.com/freedomCruz/monte-luna/backend/internal/catalog/adapters
              desc: Import only the catalog root facade
        shipping-public-surface-only:
          files:
            - "$all"
            - "!**/internal/shipping/**"
          deny:
            - pkg: github.com/freedomCruz/monte-luna/backend/internal/shipping/domain
              desc: Import only the shipping root facade
            - pkg: github.com/freedomCruz/monte-luna/backend/internal/shipping/app
              desc: Import only the shipping root facade
            - pkg: github.com/freedomCruz/monte-luna/backend/internal/shipping/adapters
              desc: Import only the shipping root facade
        shipping-generated-only-in-adapters:
          files:
            - "$all"
            - "!**/internal/shipping/adapters/**"
          deny:
            - pkg: github.com/freedomCruz/monte-luna/backend/internal/shipping/adapters/postgres/sqlc
              desc: Generated SQL models belong only in shipping adapters
        catalog-generated-only-in-adapters:
          files:
            - "$all"
            - "!**/internal/catalog/adapters/**"
          deny:
            - pkg: github.com/freedomCruz/monte-luna/backend/internal/catalog/adapters/postgres/sqlc
              desc: Generated SQL models belong only in catalog adapters
