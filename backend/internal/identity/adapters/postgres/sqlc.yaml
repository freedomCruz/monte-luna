version: "2"
sql:
  - engine: postgresql
    schema: [schema.sql, migrations]
    queries: queries
    gen:
      go:
        package: identitysql
        out: sqlc
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: string
