        '400': {$ref: '#/components/responses/AdminBadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/AdminValidationFailed'}
