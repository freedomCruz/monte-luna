        weight_grams: {type: integer, minimum: 1}
        length_mm: {type: [integer, 'null'], minimum: 1}
        width_mm: {type: [integer, 'null'], minimum: 1}
        height_mm: {type: [integer, 'null'], minimum: 1}
        tax_category: {type: string, enum: [excluded, exempt, reduced, standard]}
        status: {type: string, enum: [active, archived]}
        position: {type: integer}
