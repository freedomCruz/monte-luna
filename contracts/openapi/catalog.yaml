        title: {type: string}
        slug: {$ref: ./common.yaml#/components/schemas/Slug}
        product_type: {$ref: '#/components/schemas/AdminNamedResource'}
        categories: {type: array, items: {$ref: '#/components/schemas/AdminCategory'}}
        origin: {anyOf: [{$ref: '#/components/schemas/AdminOrigin'}, {type: 'null'}]}
        status: {$ref: '#/components/schemas/AdminProductStatus'}
        variant_count: {type: integer, minimum: 0}
        min_price_amount: {$ref: '#/components/schemas/AdminNullableAmount'}
        max_price_amount: {$ref: '#/components/schemas/AdminNullableAmount'}
        available_quantity: {type: integer, format: int64, minimum: 0}
        low_stock: {type: boolean, description: 'Fixed server flag: available_quantity < 10; zero is out of stock.'}
        image_url: {type: [string, 'null'], format: uri}
        version: {$ref: '#/components/schemas/AdminVersion'}
    AdminProduct:
      type: object
