        - $ref: '#/components/parameters/AdminTaxonomyStatus'
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Brand choices.
          headers: {Cache-Control: {$ref: '#/components/headers/AdminNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminBrandPage'}}}
        '400': {$ref: '#/components/responses/AdminBadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/AdminValidationFailed'}
        '500': {$ref: '#/components/responses/AdminInternalError'}

  /api/v1/admin/catalog/product-types:
    get:
      operationId: listAdminCatalogProductTypes
      tags: [catalog]
      summary: Read merchant-defined types and attribute definitions
      security: [{adminSession: []}]
      x-roles: [owner, staff]
      description: Name then ID ascending; definitions by position then key. No status filter or field exists.
      parameters:
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Type choices and validation metadata.
          headers: {Cache-Control: {$ref: '#/components/headers/AdminNoStore'}}
