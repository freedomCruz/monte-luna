      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AdminCategory'}}
        next_cursor: {$ref: ./common.yaml#/components/schemas/NextCursor}
        total: {type: integer, format: int64, minimum: 0}
    AdminOriginPage:
      type: object
      additionalProperties: false
