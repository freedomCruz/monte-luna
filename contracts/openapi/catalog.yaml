  /api/v1/admin/inventory/variants:
    get:
      operationId: listAdminInventoryVariants
      tags: [catalog]
      summary: Search variant stock for inventory and receipt selection
      security: [{adminSession: []}]
      x-roles: [owner, staff]
      description: |
        Literal case-insensitive product title or SKU search; title, variant
        position then variant ID ascending. All product/variant statuses included
        by default, including zero-stock variants. stock=low_or_empty selects
        available_quantity < 10. Available counters include active lots only.
        Reserved counts are authoritative held allocations composed through the
        orders public read port (including any approved payment grace), never
        inferred by summing sale movements or reading orders tables.
        Composition is not a cross-module snapshot; generated_at identifies the
        read time, counts are informational and do not authorize a stock write.
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: product_id, in: query, schema: {$ref: ./common.yaml#/components/schemas/Id}}
        - {name: status, in: query, schema: {type: string, enum: [active, archived, all], default: all}}
        - {name: stock, in: query, schema: {type: string, enum: [all, low_or_empty], default: all}}
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Variant stock selection page.
          headers: {Cache-Control: {$ref: '#/components/headers/AdminNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminInventoryVariantPage'}}}
        '400': {$ref: '#/components/responses/AdminBadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/AdminValidationFailed'}
        '500': {$ref: '#/components/responses/AdminInternalError'}
        '503': {$ref: '#/components/responses/AdminDependencyUnavailable'}

  /api/v1/admin/inventory/variants/{id}:
    parameters: [{$ref: '#/components/parameters/AdminVariantId'}]
    get:
      operationId: getAdminInventoryVariant
      tags: [catalog]
      summary: Read variant stock summary and parent ETag
      security: [{adminSession: []}]
      x-roles: [owner, staff]
      description: |
        Same stock/reservation semantics as the selection list. active_lot_count
        counts active lots with positive quantity. ETag quotes the parent product
        version, not stock or variant version; use for lot receipt. Catalog admin
        writes advance this version; order allocation/release does not.
      responses:
        '200':
          description: Variant summary with parent product ETag.
          headers:
            Cache-Control: {$ref: '#/components/headers/AdminNoStore'}
            ETag: {$ref: '#/components/headers/AdminProductETag'}
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminInventoryVariant'}}}
        '400': {$ref: '#/components/responses/AdminBadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '422': {$ref: '#/components/responses/AdminValidationFailed'}
        '500': {$ref: '#/components/responses/AdminInternalError'}
        '503': {$ref: '#/components/responses/AdminDependencyUnavailable'}

  /api/v1/admin/inventory/variants/{id}/lots:
    parameters: [{$ref: '#/components/parameters/AdminVariantId'}]
    get:
      operationId: listAdminVariantLots
      tags: [catalog]
      summary: Read lots and stock rows for one variant
      security: [{adminSession: []}]
      x-roles: [owner, staff]
      description: |
        Include every lot linked through this variant's stock rows, even depleted
        or archived and zero counters. Sort production_date then lot ID ascending.
        next_to_allocate marks only the oldest active lot with positive quantity.
        Reserved quantities come through the orders public port by variant/lot.
        old_roast is server-computed for merchant-defined coffee (type slug coffee):
        more than 30 calendar days since production_date in America/Bogota at
        generated_at; exactly 30 is false. Non-coffee is false. The flag is
        independent of status/quantity; the UI gives depleted/archive badges
        precedence. Threshold is fixed and global, not a client comparison (L4d).
      parameters:
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Oldest-first lot stock page.
          headers: {Cache-Control: {$ref: '#/components/headers/AdminNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminVariantLotPage'}}}
        '400': {$ref: '#/components/responses/AdminBadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '422': {$ref: '#/components/responses/AdminValidationFailed'}
        '500': {$ref: '#/components/responses/AdminInternalError'}
        '503': {$ref: '#/components/responses/AdminDependencyUnavailable'}

  /api/v1/admin/inventory/variants/{id}/movements:
    parameters: [{$ref: '#/components/parameters/AdminVariantId'}]
    get:
      operationId: listAdminInventoryMovements
      tags: [catalog]
      summary: Read append-only stock movement history
      security: [{adminSession: []}]
      x-roles: [owner, staff]
      description: |
        Newest first by created_at then ID descending. Optional lot_id restricts
        to that variant's lot; an unrelated well-formed ID matches no rows.
        reason is exactly the stored enum: receipt, sale, return, adjustment,
        damage, release. No reservation reason is invented (L4b). For sale rows,
        resolve reference_id through the orders public read port: display_kind
        reservation while its allocation is held, sale when committed, allocation
        if released or unresolved. Other reasons map directly to display_kind.
        These labels reflect current order state, not a rewritten historical fact;
        payment confirmation creates no second stock decrement or movement.
        order is null when no matching order exists; never infer a paid sale from
        a negative delta. Missing order context is not a fabricated order number.
        actor_name is the current name resolved by batch identity public port
        lookup, not a cross-schema read or new snapshot column (L4c). Null actor_id
        means system; a missing identity record yields null actor_name, rendered
        as an unknown admin rather than System. Dependency errors return 503,
        not fabricated counts, order states or names. No ledger update/delete API.
      parameters:
        - {name: lot_id, in: query, schema: {$ref: ./common.yaml#/components/schemas/Id}}
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Movement page with composed presentation context.
          headers: {Cache-Control: {$ref: '#/components/headers/AdminNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminInventoryMovementPage'}}}
        '400': {$ref: '#/components/responses/AdminBadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '422': {$ref: '#/components/responses/AdminValidationFailed'}
        '500': {$ref: '#/components/responses/AdminInternalError'}
        '503': {$ref: '#/components/responses/AdminDependencyUnavailable'}

  /api/v1/admin/inventory/variants/{id}/receive-lot:
    parameters: [{$ref: '#/components/parameters/AdminVariantId'}]
    post:
      operationId: receiveAdminVariantLot
      tags: [catalog]
      summary: Receive units into a product lot through a selected variant
      security: [{adminSession: []}]
      x-roles: [owner, staff]
      description: |
        Require the parent product ETag returned by inventory summary or product
        detail. Resolve product_id from the variant; client product_id, lot_id,
        actor_id, reason, stock totals and storage keys are rejected, never trusted.
        In ONE catalog transaction: lock/check parent version; resolve the lot by
        UNIQUE(product_id, lot_code), creating an active lot with attributes={}
        if absent; upsert variant_lot_stock using the same product_id on both
        composite FKs; atomically add quantity; append exactly one movement with
        reason=receipt, positive quantity_delta, actor_id from the admin session,
        reference_id=null and optional note; increment parent version and commit.
        Existing lot dates must equal the supplied production_date/expiration_date
        (omitted expiration means null); mismatch or archived lot is 409 lot_conflict,
        with no changes. Never silently rewrite shared lot metadata. A depleted
        lot becomes active with its own version check/increment; unchanged active
        lots retain their version. Reject expiration before production and int32
        counter overflow with 422 validation_failed. Concurrent order allocations
        and releases retain atomic counter semantics; never set a client total.
        Repeating a successful request with the old ETag returns 412, not a second
        receipt. After an uncertain network outcome, inspect the ledger before
        intentionally retrying with a fresh ETag. No manual adjustment in stage 3a.
        Success reports only committed catalog facts, with no post-commit external
        composition that could turn a successful receipt into a dependency error.
      parameters: [{$ref: '#/components/parameters/AdminProductIfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminReceiveLot'}}}
      responses:
        '200':
          description: Committed receipt and resulting stock row quantity; ETag is new parent product version.
          headers:
            Cache-Control: {$ref: '#/components/headers/AdminNoStore'}
            ETag: {$ref: '#/components/headers/AdminProductETag'}
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminLotReceipt'}}}
        '400': {$ref: '#/components/responses/AdminBadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '409': {$ref: '#/components/responses/AdminConflict'}
        '412': {$ref: '#/components/responses/AdminVersionConflict'}
        '422': {$ref: '#/components/responses/AdminValidationFailed'}
        '428': {$ref: '#/components/responses/AdminPreconditionRequired'}
        '500': {$ref: '#/components/responses/AdminInternalError'}

components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Public resource slug, never an internal identifier.
      schema:
        $ref: ./common.yaml#/components/schemas/Slug
    AdminProductId:
      name: id
      in: path
      required: true
      schema: {$ref: ./common.yaml#/components/schemas/Id}
    AdminVariantId:
      name: id
      in: path
      required: true
      description: Variant UUID; parent product is resolved server-side.
      schema: {$ref: ./common.yaml#/components/schemas/Id}
    AdminProductIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact strong parent product ETag; missing is 428, stale 412; no weak/wildcard/list values.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    AdminLimit:
      name: limit
      in: query
      schema: {type: integer, enum: [25, 50, 100], default: 25}
    AdminTaxonomyStatus:
      name: status
      in: query
      schema: {type: string, enum: [active, archived, all], default: active}
    AdminCategoryFilter:
      name: category_id
      in: query
      style: form
      explode: true
      schema: {type: array, minItems: 1, uniqueItems: true, items: {$ref: ./common.yaml#/components/schemas/Id}}
    AdminProductTypeFilter:
      name: product_type_id
      in: query
      style: form
      explode: true
      schema: {type: array, minItems: 1, uniqueItems: true, items: {$ref: ./common.yaml#/components/schemas/Id}}
  headers:
    StableCacheControl:
      description: Short cache lifetime for stable build-time content.
      required: true
      schema:
        type: string
        const: public, max-age=60
    LiveCacheControl:
      description: Live variant data must not be stored by browser or intermediary caches.
      required: true
      schema:
        type: string
        const: no-store
    AdminNoStore:
      schema: {type: string, pattern: '^no-store$'}
    AdminProductETag:
      description: Strong quoted parent product version; copy verbatim into If-Match.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  schemas:
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          $ref: ./common.yaml#/components/schemas/NextCursor
    CategoryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        next_cursor:
          $ref: ./common.yaml#/components/schemas/NextCursor
    OriginPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Origin'
        next_cursor:
          $ref: ./common.yaml#/components/schemas/NextCursor
    ProductAvailabilityPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductAvailability'
        next_cursor:
          $ref: ./common.yaml#/components/schemas/NextCursor
    NamedResource:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          $ref: ./common.yaml#/components/schemas/Slug
        name:
          type: string
    Category:
      type: object
      additionalProperties: false
      required: [slug, name, parent_slug, position]
      properties:
        slug:
          $ref: ./common.yaml#/components/schemas/Slug
        name:
          type: string
        parent_slug:
          anyOf:
            - $ref: ./common.yaml#/components/schemas/Slug
            - type: 'null'
        position:
          type: integer
    Image:
      type: object
      additionalProperties: false
      description: Resolved public media URL, never a storage key; array order is display order.
      required: [url, alt_text]
      properties:
        url:
          type: string
          format: uri
        alt_text:
          type: string
    ProductImage:
      type: object
      additionalProperties: false
      description: >-
        Array order follows image position, then image id ascending. Images tied
        to inactive variants are omitted. Null variant_id means a product-wide image.
      required: [url, alt_text, variant_id]
      properties:
        url:
          type: string
          format: uri
        alt_text:
          type: string
        variant_id:
          anyOf:
            - $ref: ./common.yaml#/components/schemas/Id
            - type: 'null'
    DisplayAttribute:
      type: object
      additionalProperties: false
      description: |
        Merchant-defined attribute with buyer-facing metadata, ordered by definition
        position then key. Unknown values and units are explicit nulls. Value types
        follow data_type: text/option string, integer integer, decimal number,
        boolean boolean, multi_option string array. Option values are stable keys;
        display_value is the resolved buyer-facing text (including multi-option
        labels), without a unit suffix. Clients render label, display_value, and
        unit rather than exposing machine keys. Null value implies null display_value.
      required: [key, label, data_type, unit, value, display_value]
      allOf:
        - if:
            properties:
              data_type: {enum: [text, option]}
          then:
            properties:
              value: {type: [string, 'null']}
        - if:
            properties:
              data_type: {const: integer}
          then:
            properties:
              value: {type: [integer, 'null']}
        - if:
            properties:
              data_type: {const: decimal}
          then:
            properties:
              value: {type: [number, 'null']}
        - if:
            properties:
              data_type: {const: boolean}
          then:
            properties:
              value: {type: [boolean, 'null']}
        - if:
            properties:
              data_type: {const: multi_option}
          then:
            properties:
              value:
                type: [array, 'null']
                items: {type: string}
        - if:
            properties:
              value: {type: 'null'}
          then:
            properties:
              display_value: {type: 'null'}
          else:
            properties:
              display_value: {type: string}
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        label:
          type: string
        data_type:
          type: string
          enum: [text, integer, decimal, boolean, option, multi_option]
        unit:
          type: [string, 'null']
        value:
          anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
            - type: array
              items:
                type: string
            - type: 'null'
        display_value:
          type: [string, 'null']
    Variant:
      type: object
      additionalProperties: false
      description: >-
        Stable active variant; ordered by variant position then id ascending.
        No price, stock, or lot dates belong in this representation.
      required: [id, sku, weight_grams, options]
      properties:
        id:
          $ref: ./common.yaml#/components/schemas/Id
        sku:
          type: string
        weight_grams:
          type: integer
          minimum: 1
        options:
          type: array
          description: >-
            Only variant-axis definitions (is_variant_option), with known non-null
            values: presentation and grind for configured coffee products, and any
            merchant-defined axes for other types. Roast level is never an option.
            The presentation agrees with the typed weight_grams value.
          items:
            allOf:
              - $ref: '#/components/schemas/DisplayAttribute'
              - properties:
                  value:
                    not: {type: 'null'}
    Product:
      type: object
      additionalProperties: false
      required: [slug, title, description, created_at, product_type, brand, origin, categories, images, attributes, variants]
      properties:
        slug:
          $ref: ./common.yaml#/components/schemas/Slug
        title:
          type: string
        description:
          type: [string, 'null']
        created_at:
          $ref: ./common.yaml#/components/schemas/Timestamp
        product_type:
          $ref: '#/components/schemas/NamedResource'
        brand:
          description: Active commercial brand summary, or null if absent or archived.
          anyOf:
            - $ref: '#/components/schemas/NamedResource'
            - type: 'null'
        origin:
          description: >-
            Active origin summary, or null if absent or archived. When null, render
            no origin link. This field is always present; null expresses absence.
          anyOf:
            - $ref: '#/components/schemas/OriginSummary'
            - type: 'null'
        categories:
          type: array
          description: Active categories ordered by position then slug ascending.
          items:
            $ref: '#/components/schemas/Category'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        attributes:
          type: array
          description: >-
            Product-scope attributes only, including configured species, varieties,
            process, tasting notes, cupping score and protocol, roast level, or cacao
            percentage. They never become origin facts. Includes definitions with
            unknown values as null. No coffee or cacao keys are hard-coded by the API.
          items:
            $ref: '#/components/schemas/DisplayAttribute'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
    OriginSummary:
      type: object
      additionalProperties: false
      required: [slug, name, producer_name]
      properties:
        slug:
          $ref: ./common.yaml#/components/schemas/Slug
        name:
          type: string
        producer_name:
          type: string
    Origin:
      type: object
      additionalProperties: false
      description: >-
        Origin facts only. No generic attributes bag is allowed. Product attributes
        are available exclusively through the separate published-products collection.
        The public slug is required for routing even though the canonical origin
        table description currently omits its slug column; this requires coordinator
        clarification before implementing the schema at gate G2.
      required: [slug, name, producer_name, country_code, department, municipality_code, municipality_name, altitude_min_masl, altitude_max_masl, story, images]
      properties:
        slug:
          $ref: ./common.yaml#/components/schemas/Slug
        name:
          type: string
        producer_name:
          type: string
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
        department:
          type: [string, 'null']
        municipality_code:
          type: [string, 'null']
          pattern: '^[0-9]{5}$'
          description: Colombian DANE municipality code, preserving leading zeros.
        municipality_name:
          type: [string, 'null']
        altitude_min_masl:
          type: [integer, 'null']
          minimum: 1
        altitude_max_masl:
          type: [integer, 'null']
          minimum: 1
          description: When both bounds are known, maximum is at least minimum.
        story:
          type: [string, 'null']
        images:
          type: array
          description: Ordered by image position then image id ascending.
          items:
            $ref: '#/components/schemas/Image'
    ProductAvailability:
      type: object
      additionalProperties: false
      required: [product_slug, variants]
      properties:
        product_slug:
          $ref: ./common.yaml#/components/schemas/Slug
        variants:
          type: array
          description: All active variants, ordered by position then id ascending.
          items:
            $ref: '#/components/schemas/VariantAvailability'
    VariantAvailability:
      type: object
      additionalProperties: false
      description: >-
        Fresh data matched to a stable variant by variant_id. Currency is the
        configured store currency (COP), not repeated per amount. A non-null
        compare_at_price_amount must be strictly greater than price_amount.
        No internal inventory count or lot identifier is exposed.
      required: [variant_id, price_amount, compare_at_price_amount, availability, production_date]
      allOf:
        - if:
            properties:
              availability: {const: out_of_stock}
          then:
            properties:
              production_date: {type: 'null'}
          else:
            properties:
              production_date:
                $ref: ./common.yaml#/components/schemas/CalendarDate
      properties:
        variant_id:
          $ref: ./common.yaml#/components/schemas/Id
        price_amount:
          $ref: ./common.yaml#/components/schemas/MoneyAmount
          minimum: 1
          examples: [3800000]
        compare_at_price_amount:
          anyOf:
            - $ref: ./common.yaml#/components/schemas/MoneyAmount
            - type: 'null'
          examples: [4500000, null]
        availability:
          type: string
          enum: [in_stock, out_of_stock]
          description: >-
            in_stock means summed available variant_lot_stock quantity in active
            lots is positive; otherwise out_of_stock. Reserved stock has already
            been deducted from the available counters. Out-of-stock variants stay
            visible so the UI can label their option combinations as sold out.
        production_date:
          description: >-
            Production date of the oldest active lot with positive available stock
            for this variant, ordered by production_date then lot id ascending.
            For coffee this is the roast date. Null exactly when out_of_stock.
          anyOf:
            - $ref: ./common.yaml#/components/schemas/CalendarDate
            - type: 'null'
    AdminProductStatus: {type: string, enum: [draft, published, archived]}
    AdminVersion: {type: integer, minimum: 1}
    AdminNullableId: {type: [string, 'null'], format: uuid}
    AdminNullableAmount: {type: [integer, 'null'], format: int64, minimum: 1}
    AdminAttributes:
      type: object
      description: Descriptive values validated against the selected type's definitions; unknown keys rejected.
      additionalProperties:
        anyOf:
          - {type: string}
          - {type: number}
          - {type: boolean}
          - {type: array, items: {type: string}}
    AdminNamedResource:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id: {$ref: ./common.yaml#/components/schemas/Id}
        slug: {$ref: ./common.yaml#/components/schemas/Slug}
        name: {type: string}
    AdminBrand:
      type: object
      additionalProperties: false
      required: [id, slug, name, status]
      properties:
        id: {$ref: ./common.yaml#/components/schemas/Id}
        slug: {$ref: ./common.yaml#/components/schemas/Slug}
        name: {type: string}
        status: {type: string, enum: [active, archived]}
    AdminCategory:
      type: object
      additionalProperties: false
      required: [id, slug, name, parent_id, position, status]
      properties:
        id: {$ref: ./common.yaml#/components/schemas/Id}
        slug: {$ref: ./common.yaml#/components/schemas/Slug}
        name: {type: string}
        parent_id: {$ref: '#/components/schemas/AdminNullableId'}
        position: {type: integer}
        status: {type: string, enum: [active, archived]}
    AdminOrigin:
      type: object
      additionalProperties: false
      required: [id, slug, name, producer_name, country_code, department, municipality_code, municipality_name, altitude_min_masl, altitude_max_masl, story, status]
      properties:
        id: {$ref: ./common.yaml#/components/schemas/Id}
        slug: {$ref: ./common.yaml#/components/schemas/Slug}
        name: {type: string}
        producer_name: {type: string}
        country_code: {type: string, pattern: '^[A-Z]{2}$'}
        department: {type: [string, 'null']}
        municipality_code: {type: [string, 'null'], pattern: '^[0-9]{5}$'}
        municipality_name: {type: [string, 'null']}
        altitude_min_masl: {type: [integer, 'null'], minimum: 1}
        altitude_max_masl:
          type: [integer, 'null']
          minimum: 1
          description: Maximum must be at least minimum when both are known; facts are read-only here.
        story: {type: [string, 'null']}
        status: {type: string, enum: [active, archived]}
    AdminAttributeDefinition:
      type: object
      additionalProperties: false
      required: [key, label, data_type, scope, is_variant_option, is_required, is_filterable, allowed_values, unit, position]
      description: Variant axes require scope=variant; option/multi_option require an ordered allowed_values array.
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        label: {type: string}
        data_type: {type: string, enum: [text, integer, decimal, boolean, option, multi_option]}
        scope: {type: string, enum: [product, variant]}
        is_variant_option: {type: boolean}
        is_required: {type: boolean}
        is_filterable: {type: boolean}
        allowed_values:
          type: [array, 'null']
          description: Ordered stable key and display label choices, matching storefront option values.
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value: {type: string}
              label: {type: string}
        unit: {type: [string, 'null']}
        position: {type: integer}
    AdminProductType:
      type: object
      additionalProperties: false
      required: [id, slug, name, attribute_definitions]
      description: Merchant-defined; deliberately no status field (L4a).
      properties:
        id: {$ref: ./common.yaml#/components/schemas/Id}
        slug: {$ref: ./common.yaml#/components/schemas/Slug}
        name: {type: string}
        attribute_definitions: {type: array, items: {$ref: '#/components/schemas/AdminAttributeDefinition'}}
    AdminProductRow:
      type: object
      additionalProperties: false
      required: [id, title, slug, product_type, categories, origin, status, variant_count, min_price_amount, max_price_amount, available_quantity, low_stock, image_url, version]
