        product_type: {$ref: '#/components/schemas/AdminProductType'}
        brand: {anyOf: [{$ref: '#/components/schemas/AdminBrand'}, {type: 'null'}]}
        origin: {anyOf: [{$ref: '#/components/schemas/AdminOrigin'}, {type: 'null'}]}
        categories: {type: array, items: {$ref: '#/components/schemas/AdminCategory'}}
        title: {type: string}
        slug: {$ref: ./common.yaml#/components/schemas/Slug}
        description: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/AdminProductStatus'}
        attributes: {$ref: '#/components/schemas/AdminAttributes'}
        variants: {type: array, items: {$ref: '#/components/schemas/AdminVariant'}}
