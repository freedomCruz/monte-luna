# Root task runner (go-task v3.54.0). Run `task --list` to see tasks.
version: "3"

dotenv: [".env"]

# Per-worktree values are derived from the worktree path (scripts/setup-worktree.sh),
# so the shared .env stays identical in every worktree. They override .env values.
env:
  WORKTREE_DB:
    sh: bash scripts/setup-worktree.sh --get WORKTREE_DB
  API_ADDR:
    sh: bash scripts/setup-worktree.sh --get API_ADDR
  FRONTEND_PORT:
    sh: bash scripts/setup-worktree.sh --get FRONTEND_PORT
  # Local development only; the password must be URL-safe.
  DATABASE_URL: "postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@127.0.0.1:{{.POSTGRES_PORT}}/{{.WORKTREE_DB}}?sslmode=disable"
  # Local development only: demo media keys (images/...) resolve to files that the
  # Astro server serves from frontend/public. Production uses Cloudflare R2.
  MEDIA_BASE_URL: "http://127.0.0.1:{{.FRONTEND_PORT}}/"

tasks:
  setup:
    desc: Create this worktree's database in the shared local PostgreSQL container
    silent: true
    cmds:
      - bash scripts/setup-worktree.sh

  setup:preview:
    desc: Print this worktree's database and HTTP ports without writing files or contacting Docker
    silent: true
    cmds:
      - bash scripts/setup-worktree.sh --dry-run

  backend:dev:
    desc: Run the Go API on this worktree's API_ADDR
    dir: backend
    preconditions:
      - sh: test -n "$API_ADDR"
        msg: "API_ADDR is derived by Taskfile; unset any shell override"
    cmds:
      - go run ./cmd/api

  frontend:dev:
    desc: Run Astro on this worktree's FRONTEND_PORT (localhost only)
    dir: frontend
    env:
      CATALOG_API_URL: "http://{{.API_ADDR}}"
    preconditions:
      - sh: test -n "$FRONTEND_PORT"
        msg: "FRONTEND_PORT is derived by Taskfile; unset any shell override"
    cmds:
      - npm run dev -- --host 127.0.0.1 --port "$FRONTEND_PORT"

  frontend:build:api:
    desc: Build the static storefront from this worktree's running API (start task backend:dev first)
    dir: frontend
    env:
      CATALOG_API_URL: "http://{{.API_ADDR}}"
    cmds:
      - npm run build

  backend:migrate:
    desc: Apply embedded database migrations to this worktree's database
    dir: backend
    cmds:
      - go run ./cmd/migrate

  backend:seed:
    desc: Load the idempotent demo catalog into this worktree's database (never production)
    dir: backend
    cmds:
      - go run ./cmd/seed

  backend:verify:
    desc: Verify Go module integrity, build, tests, vet, boundaries, and vulnerabilities
    dir: backend
    cmds:
      - go mod verify
      - go build -mod=readonly ./...
      - go test -mod=readonly ./...
      - go vet -mod=readonly ./...
      - go tool -modfile=tools.mod golangci-lint run ./...
      - go tool govulncheck ./...

  frontend:verify:
    desc: Clean-install and verify npm dependencies, generated API types, tests, static build, and end-to-end checks
    dir: frontend
    cmds:
      - npm ci --no-fund
      - npm audit signatures
      - npm audit --audit-level=high
      - npm run types:generate
      - git diff --exit-code -- src/generated
      - npm run check
      - npm run test
      - npm run build
      # Playwright needs Chromium once per machine: npx playwright install chromium
      - npm run test:e2e

  scripts:test:
    desc: Run the tests of repository scripts (Node built-in test runner, no network)
    cmds:
      - node --test scripts/divipola/divipola.test.mjs

  divipola:update:
    desc: Download the DANE DIVIPOLA dataset and rewrite contracts/reference/divipola.json (network)
    cmds:
      - node scripts/divipola/update-divipola.mjs

  verify:
    desc: Run all local verification gates serially (scripts, backend, then frontend)
    cmds:
      - task: scripts:test
      - task: backend:verify
      - task: frontend:verify

  dev:db:up:
    desc: Start the local PostgreSQL container and wait until it is healthy
    preconditions:
      - sh: test -f .env
        msg: "Missing .env. Create it with: cp .env.example .env"
    cmds:
      - docker compose up -d --wait postgres

  dev:db:down:
    desc: Stop the local PostgreSQL container (data is kept)
    cmds:
      - docker compose stop postgres

  dev:db:psql:
    desc: Open psql in the local PostgreSQL container
    interactive: true
    cmds:
      - docker compose exec postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
