<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Admin Monteluna · productos · tablet horizontal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 1300px; background: #FAF3E3; color: #1B1510; font-family: 'Barlow', sans-serif">
  <dc-import name="A-Productos" ancho="1024" estado="{{estado}}" panel="{{panel}}" hint-size="100%,1300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"estado":{"editor":"enum","options":["Con datos","Cargando","Vacío","Sin resultados","Error"],"default":"Con datos"},"panel":{"editor":"enum","options":["Cerrado","Abierto"],"default":"Cerrado"},"$preview":{"width":1024,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    return { estado: this.props.estado ?? 'Con datos', panel: this.props.panel ?? 'Cerrado' };
  }
}
</script>
</body>
</html>
