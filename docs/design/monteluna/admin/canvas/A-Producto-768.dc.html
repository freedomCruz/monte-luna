<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Admin Monteluna · producto · tablet vertical</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 2300px; background: #FAF3E3; color: #1B1510; font-family: 'Barlow', sans-serif">
  <dc-import name="A-Producto" ancho="768" pestana="{{pestana}}" hoja="{{hoja}}" hint-size="100%,2300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pestana":{"editor":"enum","options":["General","Atributos","Imágenes","Variantes"],"default":"Variantes"},"hoja":{"editor":"enum","options":["Cerrada","Abierta"],"default":"Abierta"},"$preview":{"width":768,"height":2300}}'>
class Component extends DCLogic {
  renderVals() {
    return { pestana: this.props.pestana ?? 'Variantes', hoja: this.props.hoja ?? 'Abierta' };
  }
}
</script>
</body>
</html>
