<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Admin Monteluna · inventario · tablet vertical</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 1700px; background: #FAF3E3; color: #1B1510; font-family: 'Barlow', sans-serif">
  <dc-import name="A-Inventario" ancho="768" hoja="{{hoja}}" hint-size="100%,1700px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hoja":{"editor":"enum","options":["Ninguna","Entrada de lote","Ajuste"],"default":"Ajuste"},"$preview":{"width":768,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    return { hoja: this.props.hoja ?? 'Ajuste' };
  }
}
</script>
</body>
</html>
