<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Admin Monteluna · pagos · tablet horizontal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 1200px; background: #FAF3E3; color: #1B1510; font-family: 'Barlow', sans-serif">
  <dc-import name="A-Pagos" ancho="1024" pestana="{{pestana}}" panel="{{panel}}" hint-size="100%,1200px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pestana":{"editor":"enum","options":["Transacciones","Reembolsos","Liquidaciones"],"default":"Reembolsos"},"panel":{"editor":"enum","options":["Ninguno","Marcar reembolsado","Registrar liquidación"],"default":"Ninguno"},"$preview":{"width":1024,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    return { pestana: this.props.pestana ?? 'Reembolsos', panel: this.props.panel ?? 'Ninguno' };
  }
}
</script>
</body>
</html>
